# Sinh bởi scripts/configure.py — reverse proxy cho Mail API (gunicorn {{api.host}}:{{api.port}}).
# Cài: cp generated/nginx/mail-api.conf /etc/nginx/sites-available/mail-api, symlink sang sites-enabled.
# Snippet whitelist sinh bởi: sudo scripts/nginx-whitelist.sh

server {
    listen 443 ssl;
    server_name {{nginx.api_hostname}};

    ssl_certificate     /etc/letsencrypt/live/{{mailu.tls.letsencrypt_name}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{mailu.tls.letsencrypt_name}}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1M;

    # Mail API dưới prefix /v1/  ->  https://{{nginx.api_hostname}}/v1/wait-email
    location /v1/ {
        include snippets/mailu-api-allow.conf;   # whitelist IP (allow ...; deny all;)

        proxy_pass http://127.0.0.1:{{api.port}}/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GHI ĐÈ (không dùng $proxy_add_x_forwarded_for) để client không chèn được IP giả
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /wait-email giữ kết nối tới khi có thư: phải >= MAX_WAIT_TIMEOUT trong .env
        proxy_read_timeout {{api_read_timeout}}s;
        proxy_send_timeout {{api_read_timeout}}s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name {{nginx.api_hostname}};
    return 301 https://$host$request_uri;
}
