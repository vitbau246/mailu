# Reverse proxy cho giao diện web của Mailu (webmail Roundcube, /admin, /api của Mailu).
# Sinh bởi scripts/configure.py. Mailu front publish HTTP tại {{mailu.http_bind}}.
# mailu.env (sinh từ templates/mailu.env.tmpl) đã đặt REAL_IP_HEADER=X-Real-IP và
# REAL_IP_FROM={{mailu.gateway_ip}} để Mailu thấy IP thật của client.

server {
    listen 443 ssl;
    server_name {{mail.hostname}};

    ssl_certificate     /etc/letsencrypt/live/{{mailu.tls.letsencrypt_name}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{mailu.tls.letsencrypt_name}}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Khớp MESSAGE_SIZE_LIMIT (50MB) để gửi được thư kèm file qua webmail
    client_max_body_size 50M;

    # Chỉ IP trong whitelist/mail.txt dùng được webmail/admin.
    # Muốn webmail công khai mà vẫn khoá admin: bỏ include ở đây, chỉ giữ trong location /admin.
    include snippets/mailu-mail-allow.conf;

    location / {
        proxy_pass http://{{mailu.http_bind}};

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin {
        include snippets/mailu-mail-allow.conf;
        proxy_pass http://{{mailu.http_bind}};

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name {{mail.hostname}};
    # Mailu (TLS_FLAVOR=letsencrypt/mail-letsencrypt) cần /.well-known; với TLS_FLAVOR=mail chỉ cần redirect
    return 301 https://$host$request_uri;
}
